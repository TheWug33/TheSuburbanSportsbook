name: Fetch TD Odds

on:
  schedule:
    # Wednesday 12:00 UTC — adjust to whenever your group locks picks
    - cron: "0 12 * * 3"
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week number"
        required: true
        default: "1"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests supabase nflreadpy pyarrow pandas
      - run: python fetch_td_odds.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NFL_WEEK: ${{ github.event.inputs.week || '1' }}
