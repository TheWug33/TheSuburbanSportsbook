name: Grade Picks

on:
  schedule:
    # Tuesday 09:00 UTC — after MNF wraps
    - cron: "0 9 * * 2"
  workflow_dispatch:
    inputs:
      week:
        description: "NFL week number to grade"
        required: true
        default: "1"

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nflreadpy supabase pyarrow pandas
      - run: python grade_picks.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NFL_WEEK: ${{ github.event.inputs.week || '1' }}
          NFL_SEASON: "2026"
